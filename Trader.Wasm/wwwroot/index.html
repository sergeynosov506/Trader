<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Trader — economic sim vs 100 AI bots</title>
    <base href="/" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="css/site.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:sans-serif; background:#16213e; color:#eee;">
            <h1>🏙️ Trader</h1>
            <p>Загружаем рынок, будим 100 ботов…</p>
            <p>Loading the market, waking up 100 bots…</p>
            <progress style="width:220px;"></progress>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none; position:fixed; bottom:0; width:100%; background:#b32121; color:white; padding:0.6rem 1.2rem; z-index:1000;">
        An unhandled error has occurred.
        <a href="." class="reload" style="color:white; text-decoration:underline;">Reload</a>
        <span class="dismiss" style="cursor:pointer; float:right;">🗙</span>
    </div>

    <script>
        // Helper for LocalStorageSaveStorage (sync JS interop)
        window.traderStorage = {
            keys: function () {
                return Object.keys(localStorage).filter(function (k) { return k.indexOf('trader-save:') === 0; });
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/lang.js"></script>
</body>

</html>
